<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analytics Dashboard</title>

    <style>

        body {

            background: #0f172a;

            color: white;

            font-family: Arial;

            margin: 0;
            padding: 20px;
        }

        h1 {

            text-align: center;

            color: #38bdf8;

            margin-bottom: 30px;
        }

        .cards {

            display: flex;

            gap: 20px;

            justify-content: center;

            flex-wrap: wrap;

            margin-bottom: 40px;
        }

        .card {

            background: #1e293b;

            padding: 25px;

            border-radius: 15px;

            width: 250px;

            text-align: center;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.4);
        }

        .card h2 {

            margin: 0;

            color: #38bdf8;
        }

        .card p {

            font-size: 30px;

            margin-top: 15px;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            background: #1e293b;
        }

        th, td {

            border: 1px solid #334155;

            padding: 15px;

            text-align: left;
        }

        th {

            background: #0284c7;
        }

        tr:nth-child(even) {

            background: #334155;
        }

    </style>

</head>

<body>

    <h1>📊 Phishing Analytics Dashboard</h1>

    <!-- ANALYTICS CARDS -->

    <div class="cards">

        <div class="card">

            <h2>Total Predictions</h2>

            <p>{{ total_predictions }}</p>

        </div>

        <div class="card">

            <h2>Phishing Detected</h2>

            <p>{{ phishing_count }}</p>

        </div>

        <div class="card">

            <h2>Safe Messages</h2>

            <p>{{ safe_count }}</p>

        </div>

    </div>

    <!-- HISTORY TABLE -->

    <table>

        <tr>

            <th>ID</th>
            <th>Message</th>
            <th>Result</th>

        </tr>

        {% for row in rows %}

        <tr>

            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
