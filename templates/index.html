<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Phishing Detector</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #0f172a;

            color: white;

        }

        .container {

            width: 90%;
            max-width: 700px;

            margin: 60px auto;

            background: #1e293b;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);

        }

        h1 {

            text-align: center;

            color: #38bdf8;

            margin-bottom: 10px;

        }

        p {

            text-align: center;

            color: #cbd5e1;

            margin-bottom: 30px;

        }

        textarea {

            width: 100%;

            height: 150px;

            border: none;

            border-radius: 10px;

            padding: 15px;

            font-size: 16px;

            resize: none;

            background: #334155;

            color: white;

        }

        textarea:focus {

            outline: none;

        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #0ea5e9;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

        }

        button:hover {

            background: #0284c7;

        }

        .result {

            margin-top: 30px;

            padding: 20px;

            border-radius: 10px;

            text-align: center;

            font-size: 20px;

            background: #334155;

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🛡 AI Phishing Detection System</h1>

        <p>
            Detect phishing and suspicious messages using Machine Learning
        </p>

        <form action="/predict" method="POST">

            <textarea
                name="message"
                placeholder="Enter suspicious message here..."
                required></textarea>

            <button type="submit">
                Analyze Message
            </button>

        </form>

        {% if prediction_text %}

            <div class="result">

                {{ prediction_text }}

            </div>

        {% endif %}

    </div>

</body>

</html>
